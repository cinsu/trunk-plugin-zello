[package]
# Your plugin's id: lowercase letters, digits and dashes. It names the
# executable, the release files and the plugin's entry in the registry.
name = "tr-pro-zello"
version = "0.1.0"
edition = "2024"
description = "Streams live radio audio to Zello and Zello Work channels."
license = "GPL-3.0-or-later"
repository = "https://github.com/cinsu/tr-plugin-zello"
authors = ["Justin Roberts"]
publish = false

[dependencies]
trunk-recorder-plugin = "0.8.0"
# The settings form is drawn from your config structs' JSON Schema. Keep the
# major version the SDK uses (1).
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Zello: a WebSocket over TLS. rustls with the ring backend, so release builds
# cross-compile without OpenSSL; ring also signs consumer Zello's tokens.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
ring = "0.17"
base64 = "0.22"
# Opus, as Rust (libopus converted from C): no C compiler or cmake needed to build it.
unsafe-libopus = "0.2"

[profile.release]
strip = true
lto = true
